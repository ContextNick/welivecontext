<style>
  /* We Live Context — colour tokens (from the design system) */
  :root {
    --wlc-rover-green:    #1B2C26;
    --wlc-sea-moss-green: #5CB8B2;
    --wlc-grey:           #F2F2F2;
    --wlc-dark-grey:      #262626;
    --wlc-white:          #FFFFFF;
    --wlc-new-york-pink:  #EA7E7E;
    --wlc-forest-green:   #36584D;
    --wlc-earth-brown:    #A97055;
    --wlc-shark-blue:     #355874;
    --wlc-powder-blue:    #8CAECA;
    --wlc-mustard-yellow: #E4A507;
    --wlc-vintage-red:    #68241E;
    --wlc-line:           #D8D8D8;
    --wlc-grey-mid:       #595959;
    --font-body: 'Aptos Display', 'Aptos', 'Hanken Grotesk', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--wlc-grey); }
  input, select, textarea, button { font-family: inherit; font-size: inherit; }
  ::selection { background: var(--wlc-sea-moss-green); color: var(--wlc-rover-green); }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--wlc-line); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

    ['631 Mobile portfolio 2030', 'V3 VodafoneThree', 'NH', 'Phil', 'Jake', 46199, 46204, 'Other', 'ready', 'client', 'Client facing portfolio pack.', 'With Jake for sign off.'],
    ['629 Vodafone QBR', 'V3 VodafoneThree', 'NH', 'Phil', 'Phil', 46184, 46188, 'PowerPoint summary', 'part', 'done', 'Quarterly business review deck.', ''],
    ['568 British Red Cross', 'BRC British Red Cross', 'NH', 'Phil', 'Annie', 46170, 46174, 'PowerPoint report', 'ready', 'done', 'Full report, signed off.', ''],
    ['622 Rubix white paper', 'RUB Rubix', 'NH', 'Sam', 'Sam', 46174, 46180, 'White paper short', 'ready', 'done', 'Short paper, delivered on time.', ''],
    ['614 Vodafone managed services', 'VODB Vodafone Business', 'NH', 'Paul', 'Claire', 46190, 46192, 'PowerPoint report', 'ready', 'done', 'Report build.', ''],
    ['1121 WLC blog and article upload', 'AA WLC Internal', 'NH', 'Other', 'Other', 46191, 46195, 'Other', 'ready', 'done', 'Site upload and formatting.', ''],
    ['609 Converged hot house updates', 'AA WLC Internal', 'NH', 'Vic', 'Vic', 46189, 46189, 'Other', 'part', 'done', 'Same day turnaround.', ''],
    ['558 Banking thought leadership', 'MDY Moody’s', 'DM', 'Mike', 'Mike', 46169, 46176, 'White paper short', 'ready', 'done', 'Short paper for the banking series.', '']
  ];

  const READY_LABEL = { ready: 'Fully ready', part: 'Still finishing', no: 'Not ready' };
  const READY_ORDER = ['ready', 'part', 'no'];
  const TYPES   = ['Video', 'Internal video', 'White paper long', 'White paper short', 'PowerPoint report', 'PowerPoint summary', 'Infographics', 'LinkedIn post', 'Proposal', 'Other'];
  const CLIENTS = ['AA WLC Internal', 'BRC British Red Cross', 'CIG Cigna', 'DIA Diageo', 'INT Intuit QuickBooks', 'JLL', 'MDY Moody’s', 'RSC RS Components', 'RUB Rubix', 'SUN Sunbelt', 'TCM Teciem', 'V3 VodafoneThree', 'VODB Vodafone Business', 'Vodafone', 'YUS Yusen Logistics'];
  const PEOPLE  = ['Abbie', 'Annie', 'Claire', 'Francis', 'Hannah', 'Hollie', 'Jake', 'Kish', 'Matt', 'Mike', 'Olly', 'Paul', 'Phil', 'Sam', 'Vic', 'Other'];
  const OWNERS  = ['Nick', 'Other'];
  const STORE   = 'wlc-work-tracker-v2';
  const EPOCH   = Date.UTC(1899, 11, 30);

  const DEFAULT_SETTINGS = {
    autoArchive: true,   // move long-completed jobs off the board into the Complete tab
    archiveDays: 14,     // how many days in the Complete column before it archives
    colorBy: 'deadline', // 'deadline' | 'type' | 'client'
    density: 'comfortable', // 'comfortable' | 'compact'
    showRank: true,
    capacityDays: 10
  };

  /* ===== Small helpers ===== */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  const App = {
    state: null,

    /* ---- data mapping (DB row <-> app item) ---- */
    seedItems() {
      return SEED.map((r, i) => ({
        id: 'j' + i, title: r[0], client: r[1], owner: asOwner(r[2]), director: r[3], contact: r[4],
        provided: r[5], needed: r[6], type: r[7], ready: r[8], status: r[9], notes: r[10], comment: r[11],
        completedAt: r[9] === 'done' ? r[6] : null, position: i  // seed order becomes initial position
      }));
    },
    rowToItem(r) {
      return {
        id: r.id, title: r.title, client: r.client, owner: asOwner(r.owner), director: r.director,
        contact: r.contact, provided: r.provided, needed: r.needed, type: r.type, ready: r.ready,
        status: r.status, notes: r.notes || '', comment: r.comment || '',
        completedAt: r.completed_at == null ? null : r.completed_at,
        position: r.position == null ? 0 : r.position
      };
    },
    itemToRow(it) {
      return {
        id: it.id, title: it.title, client: it.client, owner: it.owner, director: it.director,
        contact: it.contact, provided: it.provided, needed: it.needed, type: it.type, ready: it.ready,
        status: it.status, notes: it.notes || '', comment: it.comment || '',
        completed_at: it.completedAt == null ? null : it.completedAt,
        position: it.position == null ? 0 : it.position, updated_at: new Date().toISOString()
      };
    },
    sortItems(items) { items.sort((a, b) => (a.position || 0) - (b.position || 0)); return items; },

    /* ---- local cache (offline fallback + instant first paint) ---- */
    cacheLocal() {
      try { localStorage.setItem(STORE, JSON.stringify({ items: this.state.items, settings: this.state.settings })); } catch (e) {}
    },
    loadCache() {
      let items = this.seedItems();
      let settings = Object.assign({}, DEFAULT_SETTINGS);
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORE)); } catch (e) { saved = null; }
      if (saved && Array.isArray(saved.items) && saved.items.length) {
        items = saved.items.map((it, i) => {
          const o = Object.assign({}, it, { owner: asOwner(it.owner) });
          if (o.position == null) o.position = i;
          if (o.status === 'done' && o.completedAt == null) o.completedAt = o.needed;
          if (o.status !== 'done') o.completedAt = null;
          return o;
        });
        this.sortItems(items);
      }
      if (saved && saved.settings) settings = Object.assign({}, DEFAULT_SETTINGS, saved.settings);
      return { items, settings };
    },

    /* ---- shared store (Supabase) ---- */
    async dbLoad() {
      if (!sb) return Object.assign({ ok: false }, this.loadCache());
      try {
        let { data: rows, error } = await sb.from('jobs').select('*').order('position', { ascending: true });
        if (error) throw error;
        if (!rows || rows.length === 0) rows = await this.dbSeed();
        const items = rows.map(r => this.rowToItem(r));
        let settings = Object.assign({}, DEFAULT_SETTINGS);
        const { data: srow } = await sb.from('settings').select('*').eq('id', 'global').maybeSingle();
        if (srow && srow.data) settings = Object.assign({}, DEFAULT_SETTINGS, srow.data);
        else await sb.from('settings').upsert({ id: 'global', data: settings, updated_at: new Date().toISOString() });
        return { items, settings, ok: true };
      } catch (e) {
        console.warn('[wlc] Supabase load failed, using local cache:', e && e.message);
        return Object.assign({ ok: false }, this.loadCache());
      }
    },
    async dbSeed() {
      const rows = this.seedItems().map(it => this.itemToRow(it));
      await sb.from('jobs').upsert(rows, { onConflict: 'id', ignoreDuplicates: true });
      const { data: all, error } = await sb.from('jobs').select('*').order('position', { ascending: true });
      if (error) throw error;
      return all;
    },
    async dbSaveItem(it) {
      this.cacheLocal();
      if (!sb) return;
      const { error } = await sb.from('jobs').upsert(this.itemToRow(it), { onConflict: 'id' });
      if (error) console.warn('[wlc] save job failed:', error.message);
    },
    async dbSaveItems(items) {
      this.cacheLocal();
      if (!sb) return;
      const { error } = await sb.from('jobs').upsert(items.map(it => this.itemToRow(it)), { onConflict: 'id' });
      if (error) console.warn('[wlc] bulk save failed:', error.message);
    },
    async dbDeleteItem(id) {
      this.cacheLocal();
      if (!sb) return;
      const { error } = await sb.from('jobs').delete().eq('id', id);
      if (error) console.warn('[wlc] delete job failed:', error.message);
    },
    async dbSaveSettings() {
      this.cacheLocal();
      if (!sb) return;
      const { error } = await sb.from('settings').upsert({ id: 'global', data: this.state.settings, updated_at: new Date().toISOString() });
      if (error) console.warn('[wlc] save settings failed:', error.message);
    },
    async dbResetAll() {
      const items = this.seedItems();
      if (sb) {
        try {
          await sb.from('jobs').delete().neq('id', '__none__');
          await this.dbSaveItems(items);
        } catch (e) { console.warn('[wlc] reset failed:', e && e.message); }
      }
      this.state.items = items;
      this.state.settings = Object.assign({}, DEFAULT_SETTINGS);
      await this.dbSaveSettings();
    },

    /* ---- realtime: push every change to all open boards ---- */
    subscribeRealtime() {
      if (!sb) return;
      const self = this;
      sb.channel('wlc-board')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'jobs' }, () => self.scheduleRefresh())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, () => self.scheduleRefresh())
        .subscribe();
    },
    scheduleRefresh() { clearTimeout(this._rt); this._rt = setTimeout(() => this.refreshFromRemote(), 300); },
    async refreshFromRemote() {
      // don't yank the board out from under an active drag or an open editor
      if (this.state.dragId || this.state.drawer) { this._pending = true; return; }
      const r = await this.dbLoad();
      if (!r.ok) return;
      this.state.items = r.items;
      this.state.settings = Object.assign({}, DEFAULT_SETTINGS, r.settings);
      this.cacheLocal();
      this.render();
    },
    flushPending() { if (this._pending) { this._pending = false; this.scheduleRefresh(); } },

    setSettings(patch) { this.state.settings = Object.assign({}, this.state.settings, patch); this.render(); this.dbSaveSettings(); },
    setState(patch) { Object.assign(this.state, patch); this.render(); },

    /* ---- dates ---- */
    today() { return Math.floor((Date.now() - EPOCH) / 86400000); },
    toDate(s) { return new Date(EPOCH + s * 86400000); },
    iso(s) { return this.toDate(s).toISOString().slice(0, 10); },
    fmt(s) {
      if (s == null || s === '') return 'not set';
      const d = this.toDate(s);
      return d.getUTCDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
    },

    effort(t) { return LEAD[t] || 1; },

    /* ---- archive rule ---- */
    daysInComplete(it) {
      if (it.status !== 'done' || it.completedAt == null) return null;
      return this.today() - it.completedAt;
    },
    isArchived(it) {
      if (!this.state.settings.autoArchive) return false;
      const d = this.daysInComplete(it);
      return d != null && d >= this.state.settings.archiveDays;
    },

    due(it) {
      if (it.status === 'done') return { text: 'delivered ' + this.fmt(it.needed), tone: 'done' };
      const n = it.needed - this.today();
      if (n < 0) return { text: Math.abs(n) + (Math.abs(n) === 1 ? ' day late' : ' days late'), tone: 'late' };
      if (n === 0) return { text: 'due today', tone: 'late' };
      if (n === 1) return { text: 'due tomorrow', tone: 'soon' };
      if (n <= 4) return { text: 'in ' + n + ' days', tone: 'soon' };
      return { text: this.fmt(it.needed), tone: 'ok' };
    },
    duePill(tone) {
      const map = {
        late: 'background: var(--wlc-new-york-pink); color: var(--wlc-rover-green);',
        soon: 'background: var(--wlc-mustard-yellow); color: var(--wlc-rover-green);',
        ok:   'background: transparent; color: var(--wlc-grey-mid); border: 1px solid var(--wlc-line);',
        done: 'background: var(--wlc-sea-moss-green); color: var(--wlc-rover-green);'
      };
      return 'font-size: 10.5px; padding: 3px 6px; line-height: 1; font-weight: 500; ' + map[tone];
    },
    readyPill(r) {
      const map = {
        ready: 'background: rgba(92,184,178,0.22); color: #1B2C26;',
        part:  'background: rgba(228,165,7,0.2); color: #1B2C26;',
        no:    'background: var(--wlc-grey); color: var(--wlc-grey-mid);'
      };
      return 'font-size: 10.5px; padding: 3px 6px; line-height: 1; ' + map[r];
    },
    accentFor(it) {
      const by = this.state.settings.colorBy || 'deadline';
      if (by === 'type') {
        const pal = ['var(--wlc-sea-moss-green)','var(--wlc-new-york-pink)','var(--wlc-shark-blue)','var(--wlc-earth-brown)','var(--wlc-mustard-yellow)','var(--wlc-forest-green)','var(--wlc-powder-blue)','var(--wlc-vintage-red)'];
        return pal[TYPES.indexOf(it.type) % pal.length];
      }
      if (by === 'client') {
        const pal = ['var(--wlc-shark-blue)','var(--wlc-earth-brown)','var(--wlc-forest-green)','var(--wlc-powder-blue)','var(--wlc-new-york-pink)','var(--wlc-mustard-yellow)'];
        let h = 0;
        for (let i = 0; i < it.client.length; i++) h = (h * 31 + it.client.charCodeAt(i)) % 997;
        return pal[h % pal.length];
      }
      const t = this.due(it).tone;
      return t === 'late' ? 'var(--wlc-new-york-pink)' : t === 'soon' ? 'var(--wlc-mustard-yellow)' : t === 'done' ? 'var(--wlc-forest-green)' : 'var(--wlc-line)';
    },

    visible() {
      const { owner, client, query } = this.state;
      const q = query.trim().toLowerCase();
      return this.state.items.filter(it => {
        if (owner !== 'all' && it.owner !== owner) return false;
        if (client !== 'all' && it.client !== client) return false;
        if (q && (it.title + ' ' + it.client + ' ' + it.director).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
    },

    /* ---- mutations ---- */
    // Manage completedAt whenever status changes.
    withStatus(item, status) {
      const next = Object.assign({}, item, { status });
      if (status === 'done') {
        if (item.status !== 'done' || item.completedAt == null) next.completedAt = this.today();
      } else {
        next.completedAt = null;
      }
      return next;
    },
    move(id, col, index) {
      if (!id || !col) return;
      const items = this.state.items.slice();
      const from = items.findIndex(x => x.id === id);
      if (from < 0) return;
      const item = this.withStatus(items[from], col);
      const wasIndex = items.filter(x => x.status === col).indexOf(items[from]);
      items.splice(from, 1);
      if (wasIndex >= 0 && wasIndex < index) index -= 1;
      const inCol = items.filter(x => x.status === col);
      let at;
      if (index >= inCol.length) {
        at = inCol.length ? items.indexOf(inCol[inCol.length - 1]) + 1 : items.length;
      } else {
        at = items.indexOf(inCol[index]);
      }
      items.splice(at, 0, item);
      // fractional position between the moved card's new same-column neighbours
      const colNow = items.filter(x => x.status === col);
      const p = colNow.indexOf(item);
      const lo = p > 0 ? colNow[p - 1].position : null;
      const hi = p < colNow.length - 1 ? colNow[p + 1].position : null;
      item.position = (lo == null && hi == null) ? 0 : lo == null ? hi - 1 : hi == null ? lo + 1 : (lo + hi) / 2;
      this.state.items = items;
      this.render();
      this.dbSaveItem(item);
    },
    patch(id, fields) {
      let updated = null;
      const items = this.state.items.map(x => {
        if (x.id !== id) return x;
        updated = ('status' in fields) ? this.withStatus(Object.assign({}, x, fields), fields.status) : Object.assign({}, x, fields);
        return updated;
      });
      this.state.items = items;
      this.render();
      if (updated) this.dbSaveItem(updated);
    },

    /* ================= RENDER ================= */
    render() {
      const st = this.state;
      const S  = st.settings;
      const dense = (S.density || 'comfortable') === 'compact';
      const showRank = S.showRank !== false;
      const vis = this.visible();
      const boardVis = vis.filter(it => !this.isArchived(it)); // archived jobs leave the board + table

      const tabStyle = active => 'border: 1px solid ' + (active ? 'var(--wlc-rover-green)' : 'var(--wlc-line)')
        + '; background: ' + (active ? 'var(--wlc-rover-green)' : 'var(--wlc-white)')
        + '; color: ' + (active ? 'var(--wlc-white)' : 'var(--wlc-grey-mid)')
        + '; padding: 8px 16px; font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 0; margin-right: -1px;';
      const chipStyle = active => 'border: 1px solid ' + (active ? 'var(--wlc-sea-moss-green)' : 'var(--wlc-line)')
        + '; background: ' + (active ? 'var(--wlc-sea-moss-green)' : 'var(--wlc-white)')
        + '; color: var(--wlc-rover-green); padding: 6px 9px; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 0;';

      const archived = st.items.filter(it => this.isArchived(it));
      const live = st.items.filter(it => it.status !== 'done');
      const stats = {
        live: live.length,
        inDesign: st.items.filter(it => it.status === 'progress').length,
        late: live.filter(it => this.due(it).tone === 'late').length,
        done: st.items.filter(it => it.status === 'done').length
      };

      let html = '';
      html += this.viewHeader(stats);
      html += this.viewToolbar(tabStyle, chipStyle, vis, archived.length);

      if (st.view === 'dashboard') html += this.viewDashboard();
      if (st.view === 'board')    html += this.viewBoard(boardVis, dense, showRank);
      if (st.view === 'table')    html += this.viewTable(boardVis);
      if (st.view === 'load')     html += this.viewWorkload(S);
      if (st.view === 'complete') html += this.viewComplete(archived);

      if (st.drawer) html += this.viewDrawer();
      if (st.settingsOpen) html += this.viewSettings();

      const root = document.getElementById('app');
      root.innerHTML = html;
      this.wire(root);
    },

    viewHeader(stats) {
      const stat = (val, label, pink) =>
        '<div style="display: flex; flex-direction: column; gap: 4px;">'
        + '<div style="color: ' + (pink ? 'var(--wlc-new-york-pink)' : 'var(--wlc-white)') + '; font-size: 26px; font-weight: 700; line-height: 1;">' + val + '</div>'
        + '<div style="color: var(--wlc-sea-moss-green); font-size: 11px; letter-spacing: 0.1em;">' + label + '</div></div>';
      return ''
      + '<header style="background: var(--wlc-rover-green); padding: 18px 28px 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; flex-wrap: wrap;">'
        + '<div style="display: flex; flex-direction: column; gap: 8px;">'
          + '<div style="color: var(--wlc-sea-moss-green); font-size: 12px; letter-spacing: 0.14em; line-height: 1;">Design studio</div>'
          + '<h1 style="margin: 0; color: var(--wlc-white); font-size: 30px; font-weight: 700; line-height: 1;">Active design pipeline</h1>'
          + '<div style="color: var(--wlc-sea-moss-green); font-size: 13px; line-height: 1.3; max-width: 520px;">Drag any card to reorder the queue. Position sets priority, top of column is next up.</div>'
        + '</div>'
        + '<div style="display: flex; align-items: flex-end; gap: 28px;">'
          + '<div style="display: flex; gap: 28px;">'
            + stat(stats.live, 'Live jobs', false)
            + stat(stats.inDesign, 'In design', false)
            + stat(stats.late, 'Past deadline', true)
            + stat(stats.done, 'Complete', false)
          + '</div>'
          + '<img src="' + WLC_LOGO + '" alt="We Live Context" style="width: 120px; height: auto; display: block;">'
        + '</div>'
      + '</header>';
    },

    viewToolbar(tabStyle, chipStyle, vis, archivedCount) {
      const st = this.state;
      const clientsUsed = [];
      st.items.forEach(it => { if (clientsUsed.indexOf(it.client) < 0) clientsUsed.push(it.client); });
      clientsUsed.sort();

      const ownerChips = [{ id: 'all', label: 'Everyone' }].concat(OWNERS.map(o => ({ id: o, label: o })))
        .map(c => '<button type="button" data-action="owner" data-owner="' + c.id + '" style="' + chipStyle(st.owner === c.id) + '">' + esc(c.label) + '</button>').join('');

      const clientOpts = [{ value: 'all', label: 'All clients' }].concat(clientsUsed.map(c => ({ value: c, label: c })))
        .map(o => '<option value="' + esc(o.value) + '"' + (st.client === o.value ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('');

      const btnGhost = 'border: 1px solid var(--wlc-rover-green); background: transparent; color: var(--wlc-rover-green); padding: 8px 14px; font-size: 12px; font-weight: 500; border-radius: 0; cursor: pointer;';
      const btnGhostH = 'border: 1px solid var(--wlc-sea-moss-green); background: transparent; color: var(--wlc-sea-moss-green); padding: 8px 14px; font-size: 12px; font-weight: 500; border-radius: 0; cursor: pointer;';
      const btnPrimary = 'border: 0; background: var(--wlc-sea-moss-green); color: var(--wlc-rover-green); padding: 9px 16px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; border-radius: 0; cursor: pointer;';
      const btnPrimaryH = 'border: 0; background: var(--wlc-rover-green); color: var(--wlc-sea-moss-green); padding: 9px 16px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; border-radius: 0; cursor: pointer;';

      const completeLabel = 'Complete' + (archivedCount ? ' · ' + archivedCount : '');

      return ''
      + '<div style="background: var(--wlc-white); border-bottom: 1px solid var(--wlc-line); padding: 10px 28px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 6;">'
        + '<div style="display: flex; gap: 0;">'
          + '<button type="button" data-action="view" data-view="dashboard" style="' + tabStyle(st.view === 'dashboard') + '">Dashboard</button>'
          + '<button type="button" data-action="view" data-view="board" style="' + tabStyle(st.view === 'board') + '">Board</button>'
          + '<button type="button" data-action="view" data-view="table" style="' + tabStyle(st.view === 'table') + '">Table</button>'
          + '<button type="button" data-action="view" data-view="load" style="' + tabStyle(st.view === 'load') + '">Workload</button>'
          + '<button type="button" data-action="view" data-view="complete" style="' + tabStyle(st.view === 'complete') + '">' + completeLabel + '</button>'
        + '</div>'
        + '<div style="width: 1px; height: 24px; background: var(--wlc-line);"></div>'
        + '<div style="display: flex; align-items: center; gap: 6px;">'
          + '<span style="font-size: 11px; letter-spacing: 0.1em; color: var(--wlc-grey-mid);">Designer</span>' + ownerChips
        + '</div>'
        + '<select data-action="client" style="border: 1px solid var(--wlc-line); border-radius: 0; background: var(--wlc-white); padding: 6px 8px; font-size: 12px; color: var(--wlc-dark-grey); min-width: 150px;">' + clientOpts + '</select>'
        + '<input type="text" data-action="query" value="' + esc(st.query) + '" placeholder="Search job or client" style="border: 1px solid var(--wlc-line); border-radius: 0; padding: 6px 8px; font-size: 12px; min-width: 190px; color: var(--wlc-dark-grey);">'
        + '<div style="flex: 1;"></div>'
        + '<button type="button" data-action="settings" title="Settings" data-base="' + btnGhost + '" data-hover="' + btnGhostH + '" style="' + btnGhost + '">⚙ Settings</button>'
        + '<button type="button" data-action="sortDeadline" data-base="' + btnGhost + '" data-hover="' + btnGhostH + '" style="' + btnGhost + '">Reorder by deadline</button>'
        + '<button type="button" data-action="new" data-base="' + btnPrimary + '" data-hover="' + btnPrimaryH + '" style="' + btnPrimary + '">Book in work</button>'
      + '</div>';
    },

    viewDashboard() {
      const items = this.state.items;
      const live = items.filter(it => it.status !== 'done');
      const past = live.filter(it => this.due(it).tone === 'late');
      const archived = items.filter(it => this.isArchived(it));
      const completeTotal = items.filter(it => it.status === 'done').length;
      const byStatus = {};
      COLS.forEach(c => { byStatus[c.id] = items.filter(it => it.status === c.id).length; });

      const bigTile = (value, label, accent) =>
        '<div style="background: var(--wlc-white); border: 1px solid var(--wlc-line); border-top: 3px solid ' + accent + '; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 6px;">'
        + '<div style="font-size: 34px; font-weight: 700; line-height: 1; color: var(--wlc-rover-green);">' + value + '</div>'
        + '<div style="font-size: 11px; letter-spacing: 0.1em; color: var(--wlc-grey-mid); text-transform: uppercase;">' + label + '</div></div>';

      const big = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px;">'
        + bigTile(live.length, 'Live jobs', 'var(--wlc-sea-moss-green)')
        + bigTile(byStatus.progress, 'In design', 'var(--wlc-sea-moss-green)')
        + bigTile(past.length, 'Past deadline', 'var(--wlc-new-york-pink)')
        + bigTile(completeTotal, 'Complete', 'var(--wlc-forest-green)')
        + '</div>';

      // pipeline by stage — the five board columns + the archive
      const stageCard = (name, hint, count, accent) =>
        '<div style="background: var(--wlc-white); border: 1px solid var(--wlc-line); display: flex; align-items: stretch;">'
        + '<div style="width: 5px; background: ' + accent + ';"></div>'
        + '<div style="flex: 1; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">'
          + '<div style="display: flex; flex-direction: column; gap: 3px;"><div style="font-size: 13px; font-weight: 700; color: var(--wlc-rover-green);">' + name + '</div><div style="font-size: 11px; color: var(--wlc-grey-mid);">' + hint + '</div></div>'
          + '<div style="font-size: 24px; font-weight: 700; color: var(--wlc-rover-green); line-height: 1;">' + count + '</div>'
        + '</div></div>';
      const stages = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px;">'
        + COLS.map(c => stageCard(c.name, c.id === 'done' ? 'On the board' : c.hint, c.id === 'done' ? (byStatus.done - archived.length) : byStatus[c.id], c.accent)).join('')
        + stageCard('Archived', 'Complete tab', archived.length, 'var(--wlc-forest-green)')
        + '</div>';

      // by designer
      const byOwner = OWNERS.map(o => {
        const l = live.filter(it => it.owner === o);
        const days = l.filter(it => it.status === 'ready' || it.status === 'progress' || it.status === 'booked').reduce((a, it) => a + this.effort(it.type), 0);
        return { name: OWNER_NAMES[o] || o, live: l.length, days: Math.round(days * 10) / 10 };
      });
      const ownerRows = byOwner.map(p =>
        '<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; border-top: 1px solid var(--wlc-line); padding: 9px 0;">'
        + '<span style="font-weight: 500;">' + esc(p.name) + '</span>'
        + '<span style="color: var(--wlc-grey-mid);">' + p.live + ' live · ' + p.days + ' days</span></div>').join('');

      // by client (live), sorted, with a proportion bar
      const cc = {};
      live.forEach(it => { cc[it.client] = (cc[it.client] || 0) + 1; });
      const clients = Object.keys(cc).map(c => ({ c: c, n: cc[c] })).sort((a, b) => b.n - a.n);
      const maxC = clients.length ? clients[0].n : 1;
      const clientRows = clients.map(x =>
        '<div style="display: flex; align-items: center; gap: 10px; font-size: 12.5px; border-top: 1px solid var(--wlc-line); padding: 7px 0;">'
        + '<span style="flex: 0 0 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + esc(x.c) + '</span>'
        + '<span style="flex: 1; height: 8px; background: var(--wlc-grey); position: relative;"><span style="position: absolute; inset: 0 auto 0 0; width: ' + Math.round(x.n / maxC * 100) + '%; background: var(--wlc-sea-moss-green);"></span></span>'
        + '<span style="flex: 0 0 24px; text-align: right; color: var(--wlc-grey-mid);">' + x.n + '</span></div>').join('');

      const panel = (title, inner) =>
        '<div style="background: var(--wlc-white); border: 1px solid var(--wlc-line); padding: 16px 18px;">'
        + '<div style="font-size: 11px; letter-spacing: 0.1em; color: var(--wlc-grey-mid); text-transform: uppercase; margin-bottom: 4px;">' + title + '</div>' + inner + '</div>';

      const cols2 = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px;">'
        + panel('Workload by designer', ownerRows || '<div style="font-size:12px;color:var(--wlc-grey-mid);padding-top:8px;">No live jobs.</div>')
        + panel('Live jobs by client', clientRows || '<div style="font-size:12px;color:var(--wlc-grey-mid);padding-top:8px;">No live jobs.</div>')
        + '</div>';

      return '<div style="flex: 1; padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 20px;">'
        + '<div style="font-size: 13px; color: var(--wlc-grey-mid);">Studio overview — a live snapshot of the whole pipeline, across every designer and client.</div>'
        + big
        + '<div style="font-size: 11px; letter-spacing: 0.1em; color: var(--wlc-grey-mid); text-transform: uppercase;">Pipeline by stage</div>'
        + stages
        + cols2
        + '</div>';
    },

    viewBoard(vis, dense, showRank) {
      const st = this.state;
      const cols = COLS.map(c => {
        const cards = vis.filter(it => it.status === c.id).map((it, i) => {
          const d = this.due(it);
          const line = st.dragOverCol === c.id && st.dragOverIndex === i;
          const cardStyle = 'background: var(--wlc-white); border: 1px solid var(--wlc-line); border-left: 4px solid ' + this.accentFor(it)
            + '; padding: ' + (dense ? '8px 10px' : '11px 12px') + '; display: flex; flex-direction: column; gap: ' + (dense ? '5px' : '8px')
            + '; cursor: grab; opacity: ' + (st.dragId === it.id ? '0.35' : '1') + ';';
          const rankStyle = showRank
            ? 'width: 18px; height: 18px; flex: 0 0 18px; background: var(--wlc-grey); color: var(--wlc-grey-mid); font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;'
            : 'display: none;';
          return ''
          + '<div style="display: flex; flex-direction: column;">'
            + '<div style="height: 3px; margin-bottom: 5px; background: ' + (line ? 'var(--wlc-sea-moss-green)' : 'transparent') + ';"></div>'
            + '<div draggable="true" data-card="1" data-action="card" data-id="' + it.id + '" data-col="' + c.id + '" data-index="' + i + '" style="' + cardStyle + '">'
              + '<div style="display: flex; align-items: flex-start; gap: 8px;">'
                + '<div style="' + rankStyle + '">' + (i + 1) + '</div>'
                + '<div style="flex: 1; font-size: 13.5px; font-weight: 700; line-height: 1.3; text-wrap: pretty;">' + esc(it.title) + '</div>'
              + '</div>'
              + '<div style="font-size: 11px; color: var(--wlc-grey-mid); letter-spacing: 0.06em;">' + esc(it.client) + '</div>'
              + '<div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">'
                + '<span style="font-size: 10.5px; background: var(--wlc-grey); color: var(--wlc-grey-mid); padding: 3px 6px; line-height: 1;">' + esc(it.type) + '</span>'
                + '<span style="' + this.readyPill(it.ready) + '">' + READY_LABEL[it.ready] + '</span>'
                + '<span style="' + this.duePill(d.tone) + '">' + esc(d.text) + '</span>'
              + '</div>'
              + '<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--wlc-line); padding-top: 8px;">'
                + '<div style="display: flex; align-items: center; gap: 6px;">'
                  + '<span style="width: 22px; height: 22px; background: var(--wlc-rover-green); color: var(--wlc-white); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">' + (OWNER_INITIALS[it.owner] || '?') + '</span>'
                  + '<span style="font-size: 11px; color: var(--wlc-grey-mid);">' + esc(it.director) + ' directing</span>'
                + '</div>'
                + '<span style="font-size: 11px; color: var(--wlc-grey-mid);">' + (this.effort(it.type) + (this.effort(it.type) === 1 ? ' studio day' : ' studio days')) + '</span>'
              + '</div>'
            + '</div>'
          + '</div>';
        }).join('');

        const count = vis.filter(it => it.status === c.id).length;
        const endLine = 'height: 3px; background: ' + (st.dragOverCol === c.id && st.dragOverIndex >= count ? 'var(--wlc-sea-moss-green)' : 'transparent') + ';';
        const bodyStyle = 'flex: 1; min-height: 140px; padding: 8px; display: flex; flex-direction: column; background: '
          + (st.dragOverCol === c.id ? 'rgba(92,184,178,0.12)' : 'transparent') + '; outline: '
          + (st.dragOverCol === c.id ? '1px solid var(--wlc-sea-moss-green)' : '1px solid transparent') + ';';
        const lower = c.name.charAt(0).toLowerCase() + c.name.slice(1);
        const hint = c.id === 'done' && this.state.settings.autoArchive
          ? c.hint + ' · archives after ' + this.state.settings.archiveDays + 'd'
          : c.hint;

        const addBase = 'margin-bottom: 8px; width: 100%; border: 1px dashed var(--wlc-line); background: var(--wlc-white); color: var(--wlc-grey-mid); padding: 9px 10px; font-size: 12px; text-align: left; cursor: pointer; border-radius: 0;';
        const addHover = 'margin-bottom: 8px; width: 100%; border: 1px dashed var(--wlc-sea-moss-green); background: var(--wlc-white); color: var(--wlc-rover-green); padding: 9px 10px; font-size: 12px; text-align: left; cursor: pointer; border-radius: 0;';

        return ''
        + '<div style="width: 292px; flex: 0 0 292px; display: flex; flex-direction: column;">'
          + '<div style="background: var(--wlc-rover-green); padding: 11px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">'
            + '<div style="display: flex; flex-direction: column; gap: 4px;">'
              + '<div style="color: var(--wlc-white); font-size: 13px; font-weight: 700; letter-spacing: 0.03em; line-height: 1;">' + c.name + '</div>'
              + '<div style="color: var(--wlc-sea-moss-green); font-size: 11px; line-height: 1;">' + hint + '</div>'
            + '</div>'
            + '<div style="min-width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: var(--wlc-sea-moss-green); color: var(--wlc-rover-green); font-size: 12px; font-weight: 700; padding: 0 6px;">' + count + '</div>'
          + '</div>'
          + '<div style="height: 3px; background: ' + c.accent + ';"></div>'
          + '<div data-colbody="1" data-col="' + c.id + '" style="' + bodyStyle + '">'
            + '<button type="button" data-action="addInCol" data-col="' + c.id + '" data-base="' + addBase + '" data-hover="' + addHover + '" style="' + addBase + '">+  Add a job to ' + lower + '</button>'
            + cards
            + '<div style="' + endLine + '"></div>'
            + (count === 0 ? '<div style="border: 1px dashed var(--wlc-line); padding: 18px 12px; font-size: 12px; color: var(--wlc-grey-mid); text-align: center;">Nothing here. Drop a card in.</div>' : '')
          + '</div>'
        + '</div>';
      }).join('');

      return ''
      + '<div style="flex: 1; overflow-x: auto; padding: 20px 28px 40px;">'
        + '<div style="display: flex; align-items: flex-start; gap: 14px; min-height: 60vh;">' + cols + '</div>'
      + '</div>';
    },

    viewTable(vis) {
      const st = this.state;
      const clientsUsed = [];
      st.items.forEach(it => { if (clientsUsed.indexOf(it.client) < 0) clientsUsed.push(it.client); });
      clientsUsed.sort();

      const groupsHtml = clientsUsed.map(c => {
        const rows = vis.filter(it => it.client === c);
        if (!rows.length) return '';
        const late = rows.filter(it => this.due(it).tone === 'late' && it.status !== 'done').length;
        const summary = rows.length + ' jobs' + (late ? ', ' + late + ' past deadline' : '');
        const cols = 'grid-template-columns: 40px 2.2fr 1fr 0.9fr 1fr 0.8fr 1fr;';
        const head = ['#','Job','Type','Designer','Director','Needed','Stage']
          .map(h => '<div style="padding: 8px 10px;">' + h + '</div>').join('');
        const rowsHtml = rows.map((it, i) => {
          const col = COLS.filter(x => x.id === it.status)[0];
          const stageStyle = 'font-size: 11px; padding: 4px 8px; line-height: 1; background: ' + col.accent + '; color: var(--wlc-rover-green); display: inline-block;';
          const base = 'display: grid; ' + cols + ' gap: 0; font-size: 12.5px; border-bottom: 1px solid var(--wlc-line); cursor: pointer; align-items: center;';
          const hover = base + ' background: var(--wlc-grey);';
          return '<div data-action="card" data-id="' + it.id + '" data-base="' + base + '" data-hover="' + hover + '" style="' + base + '">'
            + '<div style="padding: 9px 10px; color: var(--wlc-sea-moss-green); font-weight: 700;">' + (i + 1) + '</div>'
            + '<div style="padding: 9px 10px; font-weight: 500;">' + esc(it.title) + '</div>'
            + '<div style="padding: 9px 10px; color: var(--wlc-grey-mid);">' + esc(it.type) + '</div>'
            + '<div style="padding: 9px 10px;">' + esc(it.owner) + '</div>'
            + '<div style="padding: 9px 10px; color: var(--wlc-grey-mid);">' + esc(it.director) + '</div>'
            + '<div style="padding: 9px 10px;">' + this.fmt(it.needed) + '</div>'
            + '<div style="padding: 9px 10px;"><span style="' + stageStyle + '">' + col.name + '</span></div>'
          + '</div>';
        }).join('');
        return ''
        + '<div style="margin-bottom: 22px; background: var(--wlc-white); border: 1px solid var(--wlc-line);">'
          + '<div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--wlc-rover-green);">'
            + '<span style="width: 10px; height: 10px; background: var(--wlc-sea-moss-green);"></span>'
            + '<span style="color: var(--wlc-white); font-size: 13px; font-weight: 700;">' + esc(c) + '</span>'
            + '<span style="color: var(--wlc-sea-moss-green); font-size: 11px; letter-spacing: 0.1em;">' + summary + '</span>'
          + '</div>'
          + '<div style="display: grid; ' + cols + ' gap: 0; font-size: 11px; letter-spacing: 0.08em; color: var(--wlc-grey-mid); border-bottom: 1px solid var(--wlc-line);">' + head + '</div>'
          + rowsHtml
        + '</div>';
      }).join('');

      return '<div style="flex: 1; padding: 20px 28px 40px;">' + groupsHtml + '</div>';
    },

    viewWorkload(S) {
      const st = this.state;
      const cap = S.capacityDays || 10;
      const cards = OWNERS.map(o => {
        const liveItems = st.items.filter(it => it.owner === o && (it.status === 'ready' || it.status === 'progress' || it.status === 'booked'));
        const days = liveItems.reduce((a, it) => a + this.effort(it.type), 0);
        const pct = Math.min(100, Math.round((days / cap) * 100));
        const over = days > cap;
        const note = over
          ? Math.round((days - cap) * 10) / 10 + ' days over the ' + cap + ' day capacity. Move work out or bring in a freelancer.'
          : Math.round((cap - days) * 10) / 10 + ' days of capacity left';
        const items = liveItems.slice(0, 8).map(it =>
          '<div data-action="card" data-id="' + it.id + '" style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 12px; border-top: 1px solid var(--wlc-line); padding-top: 6px; cursor: pointer;">'
          + '<span style="flex: 1;">' + esc(it.title) + '</span>'
          + '<span style="color: var(--wlc-grey-mid);">' + this.effort(it.type) + 'd</span></div>').join('');
        return ''
        + '<div style="background: var(--wlc-white); border: 1px solid var(--wlc-line); padding: 16px;">'
          + '<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">'
            + '<div style="display: flex; align-items: center; gap: 10px;">'
              + '<span style="width: 30px; height: 30px; background: var(--wlc-rover-green); color: var(--wlc-white); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">' + (OWNER_INITIALS[o] || '?') + '</span>'
              + '<div style="display: flex; flex-direction: column; gap: 3px;">'
                + '<div style="font-size: 14px; font-weight: 700; line-height: 1;">' + esc(OWNER_NAMES[o] || o) + '</div>'
                + '<div style="font-size: 11px; color: var(--wlc-grey-mid);">' + esc(OWNER_ROLES[o] || '') + '</div>'
              + '</div>'
            + '</div>'
            + '<div style="text-align: right;">'
              + '<div style="font-size: 22px; font-weight: 700; line-height: 1;">' + days + '</div>'
              + '<div style="font-size: 10.5px; color: var(--wlc-grey-mid); letter-spacing: 0.08em;">days booked</div>'
            + '</div>'
          + '</div>'
          + '<div style="margin-top: 14px; height: 10px; background: var(--wlc-grey);"><div style="height: 10px; width: ' + pct + '%; background: ' + (over ? 'var(--wlc-new-york-pink)' : 'var(--wlc-sea-moss-green)') + ';"></div></div>'
          + '<div style="margin-top: 6px; font-size: 11px; color: ' + (over ? 'var(--wlc-vintage-red)' : 'var(--wlc-grey-mid)') + ';">' + note + '</div>'
          + '<div style="margin-top: 14px; display: flex; flex-direction: column; gap: 6px;">' + items + '</div>'
        + '</div>';
      }).join('');

      return ''
      + '<div style="flex: 1; padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 18px;">'
        + '<div style="max-width: 720px; background: rgba(92,184,178,0.14); border-left: 4px solid var(--wlc-sea-moss-green); padding: 14px 16px;">'
          + '<div style="font-size: 12px; letter-spacing: 0.1em; color: var(--wlc-rover-green); font-weight: 700; margin-bottom: 6px;">HOW THIS IS CALCULATED</div>'
          + '<div style="font-size: 12.5px; line-height: 1.5; color: var(--wlc-dark-grey);">Studio days come from the agreed lead times: video 3 days, white paper 5 days, PowerPoint report 1.5 days, exec summary 1 day, social post a quarter day. Anything over capacity needs a freelancer or a later deadline.</div>'
        + '</div>'
        + '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px;">' + cards + '</div>'
      + '</div>';
    },

    viewComplete(archived) {
      const st = this.state;
      const S = st.settings;
      // apply the same designer/client/search filters for consistency
      const q = st.query.trim().toLowerCase();
      const rows = archived.filter(it => {
        if (st.owner !== 'all' && it.owner !== st.owner) return false;
        if (st.client !== 'all' && it.client !== st.client) return false;
        if (q && (it.title + ' ' + it.client + ' ' + it.director).toLowerCase().indexOf(q) < 0) return false;
        return true;
      }).sort((a, b) => b.completedAt - a.completedAt);

      const cols = 'grid-template-columns: 2.4fr 1.2fr 1fr 0.9fr 1fr 1fr auto;';
      const head = ['Job','Client','Type','Designer','Completed','In complete','']
        .map(h => '<div style="padding: 8px 12px;">' + h + '</div>').join('');

      const banner = ''
        + '<div style="background: rgba(54,88,77,0.10); border-left: 4px solid var(--wlc-forest-green); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">'
          + '<div>'
            + '<div style="font-size: 12px; letter-spacing: 0.1em; color: var(--wlc-rover-green); font-weight: 700; margin-bottom: 6px;">ARCHIVED &mdash; COMPLETE FOR ' + S.archiveDays + '+ DAYS</div>'
            + '<div style="font-size: 12.5px; line-height: 1.5; color: var(--wlc-dark-grey); max-width: 640px;">Jobs move here automatically once they have sat in the Complete column for ' + S.archiveDays + ' days, so the board stays focused on live work. '
            + (S.autoArchive ? 'Change the rule in Settings.' : 'Auto-archive is currently <strong>off</strong> &mdash; turn it on in Settings.') + '</div>'
          + '</div>'
          + '<div style="text-align: right;"><div style="font-size: 26px; font-weight: 700; line-height: 1; color: var(--wlc-forest-green);">' + archived.length + '</div><div style="font-size: 10.5px; color: var(--wlc-grey-mid); letter-spacing: 0.08em;">archived jobs</div></div>'
        + '</div>';

      let body;
      if (!rows.length) {
        body = '<div style="border: 1px dashed var(--wlc-line); background: var(--wlc-white); padding: 40px 20px; text-align: center; color: var(--wlc-grey-mid); font-size: 13px;">'
          + (archived.length ? 'No archived jobs match the current filters.' : 'Nothing archived yet. Completed jobs land here after ' + S.archiveDays + ' days.') + '</div>';
      } else {
        const rBase = 'display: grid; ' + cols + ' gap: 0; font-size: 12.5px; border-bottom: 1px solid var(--wlc-line); align-items: center;';
        const rHover = rBase + ' background: var(--wlc-grey);';
        const restoreBtn = 'border: 1px solid var(--wlc-rover-green); background: transparent; color: var(--wlc-rover-green); padding: 5px 10px; font-size: 11px; cursor: pointer; border-radius: 0;';
        const rowsHtml = rows.map(it => {
          const dic = this.daysInComplete(it);
          return '<div data-base="' + rBase + '" data-hover="' + rHover + '" style="' + rBase + '">'
            + '<div data-action="card" data-id="' + it.id + '" style="padding: 10px 12px; font-weight: 500; cursor: pointer;">' + esc(it.title) + '</div>'
            + '<div style="padding: 10px 12px; color: var(--wlc-grey-mid);">' + esc(it.client) + '</div>'
            + '<div style="padding: 10px 12px; color: var(--wlc-grey-mid);">' + esc(it.type) + '</div>'
            + '<div style="padding: 10px 12px;">' + esc(it.owner) + '</div>'
            + '<div style="padding: 10px 12px;">' + this.fmt(it.completedAt) + '</div>'
            + '<div style="padding: 10px 12px; color: var(--wlc-grey-mid);">' + dic + (dic === 1 ? ' day' : ' days') + '</div>'
            + '<div style="padding: 8px 12px;"><button type="button" data-action="restore" data-id="' + it.id + '" style="' + restoreBtn + '">Restore to board</button></div>'
          + '</div>';
        }).join('');

    /* ================= EVENT WIRING ================= */
    // Per-render wiring ONLY. Runs after every innerHTML swap. Must not
    // attach listeners to `root` itself — that element persists across
    // renders, so anything bound here would stack up on every render.
    wire(root) {
      const self = this;

      // hover swap — bound on freshly-created children, so no accumulation
      root.querySelectorAll('[data-hover]').forEach(el => {
        const base = el.getAttribute('data-base') || el.getAttribute('style');
        const hover = el.getAttribute('data-hover');
        el.addEventListener('mouseenter', () => { el.style.cssText = hover; });
        el.addEventListener('mouseleave', () => { el.style.cssText = base; });
      });

      // keep focus + caret in the search box across re-renders
      if (self._focusQuery) {
        const q = root.querySelector('[data-action="query"]');
        if (q) { q.focus(); const v = q.value; q.value = ''; q.value = v; }
        self._focusQuery = false;
      }
    },

    // Delegated listeners attached ONCE to the persistent #app element.
    // render() only swaps innerHTML, so #app survives and delegation via
    // closest() keeps working — re-binding these per render would stack
    // duplicate handlers and make every click/keystroke/drag fire N times.
    bindDelegation(root) {
      const self = this;

      // click delegation
      root.addEventListener('click', e => {
        const t = e.target.closest('[data-action]');
        if (!t) return;
        const a = t.getAttribute('data-action');
        switch (a) {
          case 'view':    self.setState({ view: t.dataset.view }); break;
          case 'owner':   self.setState({ owner: t.dataset.owner }); break;
          case 'sortDeadline': self.onSortDeadline(); break;
          case 'new':     self.setState({ drawer: 'new', selected: null }); break;
          case 'settings': self.setState({ settingsOpen: true, confirmReset: false }); break;
          case 'closeSettings': self.setState({ settingsOpen: false, confirmReset: false }); break;
          case 'addInCol': self.setState({ drawer: 'new', selected: null, form: Object.assign({}, self.state.form, { stage: t.dataset.col }) }); break;
          case 'close':   self.setState({ drawer: null, selected: null, confirmDelete: false }); self.flushPending(); break;
          case 'card':    self.setState({ drawer: 'detail', selected: t.dataset.id, confirmDelete: false }); break;
          case 'create':  self.onCreate(); break;
          case 'status':  self.patch(self.state.selected, { status: t.dataset.status }); break;
          case 'toTop':   self.onToTop(); break;
          case 'complete': self.patch(self.state.selected, { status: 'done' }); self.setState({ drawer: null, selected: null }); break;
          case 'restore': self.patch(t.dataset.id, { status: 'done' }); break; // withStatus resets completedAt to today
          case 'delete': self.setState({ confirmDelete: true }); break;
          case 'delete-cancel': self.setState({ confirmDelete: false }); break;
          case 'delete-confirm': self.onDeleteJob(self.state.selected); break;
          case 'toggleAuto': self.setSettings({ autoArchive: !self.state.settings.autoArchive }); break;
          case 'setDays': if (t.dataset.value) self.setSettings({ archiveDays: Math.max(1, parseInt(t.dataset.value, 10) || 14) }); break;
          case 'set-colorBy': self.setSettings({ colorBy: t.dataset.value }); break;
          case 'set-density': self.setSettings({ density: t.dataset.value }); break;
          case 'set-showRank': self.setSettings({ showRank: t.dataset.value === 'true' }); break;
          case 'reset': self.setState({ confirmReset: true }); break;
          case 'reset-cancel': self.setState({ confirmReset: false }); break;
          case 'reset-confirm': self.state.confirmReset = false; self.onReset(); break;
        }
      });

      // change / input delegation
      root.addEventListener('input', e => self.onFieldEvent(e));
      root.addEventListener('change', e => self.onFieldEvent(e));

      // drag & drop delegation
      root.addEventListener('dragstart', e => {
        const card = e.target.closest('[data-card]');
        if (!card) return;
        const id = card.dataset.id;
        try { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
        self.state.dragId = id; // no re-render on dragstart to keep the drag image
        card.style.opacity = '0.35';
      });
      root.addEventListener('dragend', () => {
        self.state.dragId = null; self.state.dragOverCol = null; self.state.dragOverIndex = null;
        self.render(); // one clean re-render resets opacity + indicators
        self.flushPending(); // apply any remote updates that arrived mid-drag
      });
      // NOTE: dragover must NOT re-render. Replacing innerHTML mid-drag
      // destroys the dragged node and the drop target, which flickers and
      // can abort the drag in some browsers. Instead we stash the target
      // and paint the drop indicator directly on the live DOM.
      root.addEventListener('dragover', e => {
        if (!self.state.dragId) return;
        let col, idx;
        const card = e.target.closest('[data-card]');
        if (card) {
          e.preventDefault(); e.stopPropagation();
          const r = card.getBoundingClientRect();
          idx = Number(card.dataset.index) + (e.clientY > r.top + r.height / 2 ? 1 : 0);
          col = card.dataset.col;
        } else {
          const body = e.target.closest('[data-colbody]');
          if (!body) return;
          e.preventDefault();
          col = body.dataset.col;
          idx = self.visible().filter(it => !self.isArchived(it) && it.status === col).length;
        }
        if (self.state.dragOverCol !== col || self.state.dragOverIndex !== idx) {
          self.state.dragOverCol = col; self.state.dragOverIndex = idx;
          self.paintDrag();
        }
      });
      root.addEventListener('drop', e => {
        if (!self.state.dragId) return;
        e.preventDefault(); e.stopPropagation();
        const id = self.state.dragId, col = self.state.dragOverCol, idx = self.state.dragOverIndex;
        self.state.dragId = null; self.state.dragOverCol = null; self.state.dragOverIndex = null;
        self.move(id, col, idx); // move() re-renders (and clears the indicator)
      });
    },

    // Live drop feedback painted directly onto the DOM during a drag.
    // CRITICAL: only paint-only CSS (background, outline, box-shadow) —
    // never insert/move elements or change box size here. Mutating layout
    // under the cursor mid-drag makes native HTML5 drag stop firing
    // dragover until the mouse moves again (the "freeze"). box-shadow and
    // outline don't reflow, so the element under the pointer never shifts.
    paintDrag() {
      const root = document.getElementById('app');
      const st = this.state;
      root.querySelectorAll('[data-colbody]').forEach(b => {
        const active = b.dataset.col === st.dragOverCol;
        b.style.background = active ? 'rgba(92,184,178,0.12)' : 'transparent';
        b.style.outline = active ? '1px solid var(--wlc-sea-moss-green)' : '1px solid transparent';
      });
      root.querySelectorAll('[data-card]').forEach(c => { c.style.boxShadow = ''; });
      if (st.dragOverCol == null) return;
      const body = root.querySelector('[data-colbody][data-col="' + st.dragOverCol + '"]');
      if (!body) return;
      const cards = Array.prototype.slice.call(body.querySelectorAll('[data-card]'));
      if (!cards.length) return; // empty column: the body highlight is the cue
      if (st.dragOverIndex < cards.length) {
        cards[st.dragOverIndex].style.boxShadow = 'inset 0 3px 0 0 var(--wlc-sea-moss-green)';   // insert above this card
      } else {
        cards[cards.length - 1].style.boxShadow = 'inset 0 -3px 0 0 var(--wlc-sea-moss-green)';  // insert at the end
      }
    },

    onFieldEvent(e) {
      const t = e.target.closest('[data-action]');
      if (!t) return;
      const a = t.getAttribute('data-action');
      if (a === 'client') { this.setState({ client: t.value }); }
      else if (a === 'query') { this._focusQuery = true; this.setState({ query: t.value }); }
      else if (a === 'form') {
        const f = Object.assign({}, this.state.form);
        f[t.name] = t.value;
        this.state.form = f;
        // only re-render on change (selects/date) to avoid disrupting typing; text handled on change too
        if (e.type === 'change') this.render();
      }
      else if (a === 'setDays' && e.type !== 'click') { this.setSettings({ archiveDays: Math.max(1, parseInt(t.value, 10) || 14) }); }
      else if (a === 'setCap') { this.setSettings({ capacityDays: Math.min(20, Math.max(4, parseInt(t.value, 10) || 10)) }); }
      else if (a === 'edit' && e.type === 'change') { this.onEditField(t); }
    },
    // Edit a field of the selected job straight to the shared board.
    onEditField(t) {
      const id = this.state.selected;
      const field = t.getAttribute('data-field');
      if (!id || !field) return;
      let val = t.value;
      if (field === 'needed' || field === 'provided') {
        if (!val) return;                     // don't clear a date to NaN
        const ms = Date.parse(val + 'T00:00:00Z');
        if (isNaN(ms)) return;
        val = Math.round((ms - EPOCH) / 86400000);
      } else {
        val = (val == null ? '' : String(val)).trim();
        if (field === 'title' && !val) return; // never blank the title
      }
      this.patch(id, { [field]: val });        // patch() persists + re-renders
    },

    onSortDeadline() {
      const order = {};
      COLS.forEach((c, i) => { order[c.id] = i; });
      const sorted = this.state.items.slice().sort((a, b) => (order[a.status] - order[b.status]) || (a.needed - b.needed));
      const items = sorted.map((it, i) => Object.assign({}, it, { position: i })); // re-index everyone
      this.state.items = items;
      this.render();
      this.dbSaveItems(items);
    },
    onToTop() {
      const id = this.state.selected;
      const it = this.state.items.filter(x => x.id === id)[0];
      if (it) this.move(id, it.status, 0);
    },
    onDeleteJob(id) {
      if (!id) return;
      this.state.items = this.state.items.filter(x => x.id !== id);
      this.state.drawer = null; this.state.selected = null; this.state.confirmDelete = false;
      this.render();
      this.dbDeleteItem(id);
    },
    onCreate() {
      const f = this.state.form;
      if (!f.title.trim()) return;
      const readyKey = READY_ORDER.indexOf(f.ready) >= 0 ? f.ready : (READY_ORDER.filter(k => READY_LABEL[k] === f.ready)[0] || 'no');
      const needed = Math.round((Date.parse(f.needed + 'T00:00:00Z') - EPOCH) / 86400000);
      const status = f.stage || (readyKey === 'no' ? 'booked' : 'ready');
      // land it at the top of its stage column (smallest position there)
      const colItems = this.state.items.filter(x => x.status === status);
      const minPos = colItems.length ? Math.min.apply(null, colItems.map(x => x.position || 0)) : 0;
      const item = {
        id: 'n' + Date.now(), title: f.title.trim(), client: f.client, owner: f.owner,
        director: f.director, contact: f.director, provided: this.today(), needed: needed,
        type: f.type, ready: readyKey, status: status,
        notes: f.notes, comment: f.link ? 'Document: ' + f.link : '',
        completedAt: status === 'done' ? this.today() : null,
        position: minPos - 1
      };
      const items = [item].concat(this.state.items);
      this.sortItems(items);
      this.state.items = items;
      this.state.form = Object.assign({}, f, { title: '', notes: '', link: '' });
      this.state.drawer = null;
      this.render();
      this.dbSaveItem(item);
    },
    async onReset() {
      await this.dbResetAll();
      this.setState({ settingsOpen: false });
    },

    baseState() {
      return {
        view: 'board', owner: 'all', client: 'all', query: '',
        dragId: null, dragOverCol: null, dragOverIndex: null,
        drawer: null, selected: null, settingsOpen: false, confirmReset: false, confirmDelete: false,
        form: { title: '', client: 'AA WLC Internal', owner: 'Nick', director: 'Other', contact: 'Other', type: 'PowerPoint report', needed: this.iso(this.today() + 7), ready: 'no', stage: 'booked', notes: '', link: '' }
      };
    },

    async init() {
      const cache = this.loadCache();  // instant first paint from local cache / seed
      this.state = Object.assign(this.baseState(), { items: cache.items, settings: cache.settings });
      this.bindDelegation(document.getElementById('app')); // once — survives re-renders
      this.render();
      const r = await this.dbLoad();   // then swap in the shared board
      if (r.ok) {
        this.state.items = r.items;
        this.state.settings = Object.assign({}, DEFAULT_SETTINGS, r.settings);
        this.cacheLocal();
        this.render();
      }
      this.subscribeRealtime();        // live updates from everyone else
    }
  };

  window.WLCTracker = App; // handy for the console

  /* ===== Password gate (in-page; light deterrent, not hard security) =====
     Only the SHA-256 hash of the password lives here. An unlock token
     (the same hash) is stored on the device so people aren't re-prompted
     every visit; changing the password below invalidates every stored
     unlock automatically. */
  const GATE_HASH = 'bee111eca90c948fa76c0147870d9d6e44c7a589a6805292637e9537f941292e'; // SHA-256 of the studio password
  const GATE_STORE = 'wlc-gate';

  async function sha256Hex(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.prototype.map.call(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
  }
  function gateUnlocked() {
    try { return localStorage.getItem(GATE_STORE) === GATE_HASH; } catch (e) { return false; }
  }
  let _booted = false;
  function bootApp() { if (!_booted) { _booted = true; App.init(); } }
  function showGate() {
    const g = document.createElement('div');
    g.id = 'wlc-gate';
    // frosted glass: blurs the board rendered behind it so you can sense it through the panel
    g.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(27,44,38,0.35);-webkit-backdrop-filter:blur(9px) saturate(1.1);backdrop-filter:blur(9px) saturate(1.1);font-family:var(--font-body);';
    g.innerHTML =
      '<form style="width:340px;max-width:88vw;background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);padding:28px 26px;display:flex;flex-direction:column;gap:14px;border:1px solid rgba(255,255,255,0.55);border-radius:16px;box-shadow:0 16px 48px rgba(27,44,38,0.30);">'
      + '<img src="' + WLC_LOGO + '" alt="We Live Context" style="width:170px;max-width:80%;height:auto;display:block;margin:4px auto 8px;filter:brightness(0);">'
      + '<div style="font-size:13px;color:var(--wlc-grey-mid);line-height:1.4;text-align:center;">Enter the studio password to open the work tracker.</div>'
      + '<input id="wlc-gate-input" type="password" autocomplete="current-password" placeholder="Password" style="border:1px solid var(--wlc-line);border-radius:0;padding:10px 12px;font-size:14px;color:var(--wlc-dark-grey);">'
      + '<div id="wlc-gate-err" style="font-size:12px;color:var(--wlc-vintage-red);min-height:15px;line-height:1.2;"></div>'
      + '<button type="submit" style="border:0;background:var(--wlc-sea-moss-green);color:var(--wlc-rover-green);padding:11px 16px;font-size:13px;font-weight:700;letter-spacing:0.04em;cursor:pointer;border-radius:0;">Enter</button>'
      + '</form>';
    document.body.appendChild(g);
    const input = g.querySelector('#wlc-gate-input');
    const err = g.querySelector('#wlc-gate-err');
    input.focus();
    g.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault();
      let ok = false;
      try { ok = (await sha256Hex(input.value)) === GATE_HASH; } catch (_) { ok = false; }
      if (ok) {
        try { localStorage.setItem(GATE_STORE, GATE_HASH); } catch (_) {}
        g.style.transition = 'opacity 0.25s';
        g.style.opacity = '0';
        setTimeout(() => g.remove(), 260);
      } else {
        err.textContent = 'Incorrect password.';
        input.value = ''; input.focus();
      }
    });
  }

  // Render the board first so it shows (blurred) behind the glass gate,
  // then overlay the password panel when the device isn't unlocked yet.
  bootApp();
  if (!gateUnlocked()) showGate();
})();
</script>
</body>
</html>
